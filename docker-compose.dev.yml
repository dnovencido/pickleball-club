services:
  pickleball:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - pball_node_modules:/app/node_modules
    command: sh -c "npm install && node --watch server.js"

volumes:
  pball_node_modules:
